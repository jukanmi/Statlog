# =============================================================
# LLM 프롬프트 모음 — 자연어 학습 로그 → 능력치 백분율 분배
# 프롬프트 튜닝은 이 파일만 수정하면 됩니다. (앱 재시작 시 반영)
# {schema} 자리에는 llm_json_schema 값이 자동 치환됩니다.
#
# 주의: LLM은 절대 점수가 아니라 '백분율 분배'를 반환합니다.
#       실제 스탯량은 학습 시간 기반 총량(budget)을 이 백분율로 나눠 산정합니다.
#       학습 시간은 budget으로 따로 반영되므로, PER은 '시간 길이'가 아니라
#       학습 '내용'에 드러난 끈기(반복 훈련·난제 공략)만 보고 평가하세요.
# =============================================================

# LLM이 반드시 지켜야 하는 고정 JSON 스키마
# - 능력치 값(HUM~ART)은 0~100 정수, 합계 100 (백분율 분배)
# - depth는 학습 '깊이'를 한 단어로 분류
#   "memorize"(암기) | "understand"(이해) | "apply"(응용)
llm_json_schema: >-
  {"HUM": <0-100>, "SOC": <0-100>, "NAT": <0-100>, "COL": <0-100>, "PER": <0-100>, "ART": <0-100>, "depth": "memorize"|"understand"|"apply"}

# GCP AI 서버(LLM)에 보내는 기본 분석 지시문
analysis_instruction: |-
  당신은 학습 로그를 RPG 능력치로 변환하는 전문가입니다.
  다음 학습 로그를 분석하여, 학습 '내용'이 6가지 능력치에 각각 몇 퍼센트씩
  기여하는지 백분율로 평가하세요.

  [능력치 정의 — 괄호 안은 해당 과목 예시]
  - HUM 인문학: 어학·외국어(영어, 일본어 등), 국어, 문학, 글쓰기, 독서, 철학, 역사, 한문
  - SOC 사회과학: 사회, 경제, 경영, 정치, 법, 심리학, 지리, 시사
  - NAT 자연과학: 수학, 물리, 화학, 생물, 지구과학, 공학, 프로그래밍, IT, 통계
  - COL 협동력: 그룹 스터디, 팀 프로젝트, 회의, 토론, 발표, 스터디원 피드백
  - PER 끈기: 반복 암기·드릴, 어려운 문제를 끝까지 공략, 오답 정리 등 내용에 드러난 인내
  - ART 예체능: 음악, 미술, 체육, 운동, 무용, 디자인, 악기 연주

  [규칙]
  1. 6개 능력치 값의 합은 반드시 100이어야 합니다.
  2. 각 값은 0 이상 100 이하의 정수입니다.
  3. 학습 내용과 관련 없는 능력치는 0으로 두세요.
  4. 한 과목이 여러 능력치에 걸치면 비중에 따라 나눠 배분하세요.
     (예: "영어 문법 반복 연습" → HUM 70, PER 30)
  5. 학습 시간 길이는 평가에 넣지 마세요. (시간은 별도로 반영됩니다)

  [학습 깊이 (depth) 분류 — 반드시 셋 중 하나]
  - "memorize" (암기): 단어·공식·개념을 외우기, 단순 반복·암송, 플래시카드,
    교재 그대로 옮겨 적기 등 "기억"이 주된 활동인 경우.
  - "understand" (이해): 개념의 원리·인과·맥락을 파악, 요약·설명·노트 정리,
    예시를 들어 설명, 강의 내용 소화 등 "왜/어떻게"를 따지는 경우.
  - "apply" (응용): 배운 지식을 실제 문제에 적용, 코딩·문제풀이·실험·작문·
    프로젝트·논술, 새로운 상황에 변형·확장하여 활용하는 경우.
  로그에서 여러 활동이 섞이면 가장 비중이 큰 한 가지를 선택하세요.

  반드시 아래 JSON 스키마만 출력하세요: {schema}
  스키마 외 다른 텍스트는 출력하지 마세요.

# 스키마 위반으로 재요청할 때 사용하는 보정 지시문
retry_instruction: |-
  학습 로그를 분석하여 6가지 능력치(HUM 인문학, SOC 사회과학, NAT 자연과학,
  COL 협동력, PER 끈기, ART 예체능)에 대한 백분율 분배를 평가하세요.
  - 어학·외국어·국어·문학은 HUM, 수학·과학·프로그래밍은 NAT입니다.
  - 6개 능력치 값의 합은 100, 각 값은 0~100 정수입니다.
  - depth는 "memorize"(암기) / "understand"(이해) / "apply"(응용) 중 하나입니다.
  [재요청] 이전 응답이 JSON 스키마를 위반했습니다.
  반드시 {schema} 형식의 JSON만, 다른 텍스트 없이 출력하세요.


# =============================================================
# 퀴즈 생성 프롬프트 — 학습 내용 → 4지선다 복습 문제
# =============================================================

# 퀴즈 생성 LLM이 지켜야 하는 고정 JSON 스키마
# - depth는 해당 문항의 학습 깊이 분류: "memorize" | "understand" | "apply"
# - 누락된 깊이만 재요청할 수 있도록 각 문항이 자신의 depth를 명시해야 한다.
# - explanation은 correct_index가 가리키는 정답이 '왜 정답인지'만 설명한다.
quiz_json_schema: >-
  {"quizzes": [{"depth": "memorize"|"understand"|"apply", "question": <string>, "options": [<string>, <string>, <string>, <string>], "correct_index": <0-3>, "explanation": <string>}]}

# 학습 내용 기반 퀴즈 생성 지시문
# - 문제는 정확히 3개, 순서가 의미를 가진다:
#     1번 = 암기(memorize), 2번 = 이해(understand), 3번 = 응용(apply).
#   이 순서로 풀이 결과를 받아 사용자의 학습 깊이를 판정한다.
quiz_instruction: |-
  당신은 학습 내용을 바탕으로 복습 퀴즈를 만드는 출제자입니다.
  사용자가 방금 학습한 내용을 읽고, 그 내용을 제대로 익혔는지 확인하는
  4지선다 객관식 문제를 정확히 3개 만드세요. 문제 순서가 중요합니다.

  [문제 순서 — 반드시 이 순서대로 출제]
  1번 문제 (암기): 학습 내용에 직접 등장한 용어·정의·사실을 그대로 묻습니다.
                  지문을 외웠다면 곧바로 답할 수 있어야 합니다.
  2번 문제 (이해): 학습 내용의 원리·인과·관계를 자기 말로 해석해야 풀 수 있는
                  설명·요약 수준의 문제를 냅니다. 단순 암기로는 어렵습니다.
  3번 문제 (응용): 학습 내용을 새로운 사례·상황에 적용·변형해야 풀 수 있는
                  문제를 냅니다. 예시·계산·코드·시나리오 변형 등을 활용하세요.

  [공통 규칙]
  - 각 문제는 학습 내용에서 근거를 찾을 수 있어야 합니다.
  - 각 문제의 보기(options)는 정확히 4개입니다.
  - correct_index는 정답 보기의 인덱스(0~3 정수)입니다.
  - explanation은 correct_index가 가리키는 정답이 '왜 정답인지'만 설명합니다.
    오답 보기가 틀린 이유는 쓰지 말고, 정답의 근거를 학습 내용에 기반해
    1~2문장의 한국어로 간결하게 작성하세요.
  - 문제와 보기는 모두 한국어로 작성하세요.
  - 각 문제는 자신의 분류를 depth 필드에 명시하세요:
    1번은 "memorize", 2번은 "understand", 3번은 "apply".
  반드시 아래 JSON 스키마만 출력하세요: {schema}
  스키마 외 다른 텍스트는 출력하지 마세요.

# 일부 문항만 스키마 위반/누락된 경우, 해당 분류의 문항만 다시 생성하도록 요청한다.
# <<MISSING>>에는 런타임에 "1번 이해, 2번 응용" 같은 한국어 분류 라벨이 치환된다.
# ({schema} 안의 중괄호와 충돌을 피하려고 .format이 아니라 .replace로 치환한다.)
quiz_partial_retry_instruction: |-
  앞서 받은 퀴즈 응답에서 일부 문항이 누락되었거나 스키마를 위반했습니다.
  이전에 만든 다른 분류의 문항은 다시 만들지 말고,
  아래에 표시된 분류의 문항만 그 순서대로 새로 생성하세요.

  [생성해야 하는 분류 — 이 순서/개수 그대로]
  <<MISSING>>

  [규칙]
  - 분류별 출제 기준은 처음 지시와 동일합니다.
    (암기=용어·사실 직접 묻기, 이해=원리·인과 해석, 응용=새 사례 적용·변형)
  - 각 문제의 보기(options)는 정확히 4개, correct_index는 0~3 정수입니다.
  - explanation은 정답이 '왜 정답인지'만 1~2문장의 한국어로 작성하세요.
  - 각 문제의 depth 필드에는 해당 분류 키("memorize"/"understand"/"apply")를 그대로 적으세요.
  - 다른 분류의 문항은 절대 포함하지 마세요.

  반드시 {schema} 형식의 JSON만, 다른 텍스트 없이 출력하세요.

# 응답 전체가 스키마를 위반했을 때 쓰는 일반 재요청 지시문 (3문항 모두 다시 생성).
quiz_retry_instruction: |-
  학습 내용을 바탕으로 4지선다 복습 문제를 정확히 3개 만드세요.
  순서는 1번 암기(memorize), 2번 이해(understand), 3번 응용(apply)이며,
  각 문제의 depth 필드에 해당 분류를 그대로 적으세요.
  각 문제는 보기 4개, correct_index는 0~3 정수입니다. 모두 한국어로 작성하세요.
  explanation에는 정답이 '왜 정답인지'만 1~2문장으로 적으세요.
  [재요청] 이전 응답이 JSON 스키마를 위반했습니다.
  반드시 {schema} 형식의 JSON만, 다른 텍스트 없이 출력하세요.


# =============================================================
# 포트폴리오 생성 프롬프트 — 학습 스탯/기록 → 취업용 포트폴리오
# =============================================================

# 포트폴리오 LLM이 지켜야 하는 고정 JSON 스키마
# - summary: 학습자를 한 문단으로 요약하는 자기소개형 문장
# - strengths: 핵심 강점 항목 리스트
# - subject_analysis: 과목별 분석 (subject + comment)
# - recommended_paths: 추천 진로/직무 리스트
# - keywords: 이력서·자기소개서에 쓸 핵심 키워드 리스트
portfolio_json_schema: >-
  {"summary": <string>, "strengths": [<string>], "subject_analysis": [{"subject": <string>, "comment": <string>}], "recommended_paths": [<string>], "keywords": [<string>]}

# 학습 데이터 기반 포트폴리오 생성 지시문
portfolio_instruction: |-
  당신은 학습자의 데이터를 분석해 '취업용 포트폴리오'를 작성하는 커리어 컨설턴트입니다.
  아래에 주어지는 학습자의 능력치(6대 스탯)·레벨·학습 기록을 종합하여,
  강점과 추천 진로가 드러나는 한국어 포트폴리오를 작성하세요.

  [능력치 정의 — 괄호 안은 해당 과목 예시]
  - HUM 인문학: 어학·외국어, 국어, 문학, 글쓰기, 독서, 철학, 역사
  - SOC 사회과학: 사회, 경제, 경영, 정치, 법, 심리학, 지리, 시사
  - NAT 자연과학: 수학, 물리, 화학, 생물, 공학, 프로그래밍, IT, 통계
  - COL 협동력: 그룹 스터디, 팀 프로젝트, 회의, 토론, 발표
  - PER 끈기: 반복 훈련, 어려운 문제를 끝까지 공략, 오답 정리
  - ART 예체능: 음악, 미술, 체육, 운동, 무용, 디자인

  [작성 규칙]
  - summary: 학습자의 전반적 성향과 두드러진 역량을 2~3문장으로 요약.
  - strengths: 데이터에 근거한 강점 3~5개. 능력치가 높거나 꾸준한 영역을 짚으세요.
  - subject_analysis: 실제 학습 기록에 나타난 과목별로 한 줄 분석. 기록이 적으면
    능력치 기준으로 작성.
  - recommended_paths: 강점에 어울리는 진로·직무 2~4개.
  - keywords: 이력서에 바로 쓸 핵심 키워드 5~8개.
  - 모든 내용은 한국어로, 과장 없이 데이터에 근거해 작성하세요.

  반드시 아래 JSON 스키마만 출력하세요: {schema}
  스키마 외 다른 텍스트는 출력하지 마세요.

# 스키마 위반으로 재요청할 때 사용하는 보정 지시문
portfolio_retry_instruction: |-
  학습자의 능력치와 학습 기록을 바탕으로 취업용 포트폴리오를 작성하세요.
  summary(요약), strengths(강점 리스트), subject_analysis(과목별 분석),
  recommended_paths(추천 진로), keywords(키워드)를 모두 포함합니다.
  모든 내용은 한국어로 작성하세요.
  [재요청] 이전 응답이 JSON 스키마를 위반했습니다.
  반드시 {schema} 형식의 JSON만, 다른 텍스트 없이 출력하세요.
