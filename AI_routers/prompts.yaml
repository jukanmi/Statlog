# =============================================================
# LLM 프롬프트 모음 — 자연어 학습 로그 → 능력치 백분율 분배
# 프롬프트 튜닝은 이 파일만 수정하면 됩니다. (앱 재시작 시 반영)
# {schema} 자리에는 llm_json_schema 값이 자동 치환됩니다.
#
# 주의: LLM은 절대 점수가 아니라 '백분율 분배'를 반환합니다.
#       실제 스탯량은 학습 시간 기반 총량(budget)을 이 백분율로 나눠 산정합니다.
#       학습 시간은 budget으로 따로 반영되므로, PER은 '시간 길이'가 아니라
#       학습 '내용'에 드러난 끈기(반복 훈련·난제 공략)만 보고 평가하세요.
# =============================================================

# LLM이 반드시 지켜야 하는 고정 JSON 스키마 (각 값은 0~100 정수, 합계 100)
llm_json_schema: >-
  {"HUM": <0-100>, "SOC": <0-100>, "NAT": <0-100>, "COL": <0-100>, "PER": <0-100>, "ART": <0-100>}

# GCP AI 서버(LLM)에 보내는 기본 분석 지시문
analysis_instruction: |-
  당신은 학습 로그를 RPG 능력치로 변환하는 전문가입니다.
  다음 학습 로그를 분석하여, 학습 '내용'이 6가지 능력치에 각각 몇 퍼센트씩
  기여하는지 백분율로 평가하세요.

  [능력치 정의 — 괄호 안은 해당 과목 예시]
  - HUM 인문학: 어학·외국어(영어, 일본어 등), 국어, 문학, 글쓰기, 독서, 철학, 역사, 한문
  - SOC 사회과학: 사회, 경제, 경영, 정치, 법, 심리학, 지리, 시사
  - NAT 자연과학: 수학, 물리, 화학, 생물, 지구과학, 공학, 프로그래밍, IT, 통계
  - COL 협동력: 그룹 스터디, 팀 프로젝트, 회의, 토론, 발표, 스터디원 피드백
  - PER 끈기: 반복 암기·드릴, 어려운 문제를 끝까지 공략, 오답 정리 등 내용에 드러난 인내
  - ART 예체능: 음악, 미술, 체육, 운동, 무용, 디자인, 악기 연주

  [규칙]
  1. 6개 값의 합은 반드시 100이어야 합니다.
  2. 각 값은 0 이상 100 이하의 정수입니다.
  3. 학습 내용과 관련 없는 능력치는 0으로 두세요.
  4. 한 과목이 여러 능력치에 걸치면 비중에 따라 나눠 배분하세요.
     (예: "영어 문법 반복 연습" → HUM 70, PER 30)
  5. 학습 시간 길이는 평가에 넣지 마세요. (시간은 별도로 반영됩니다)

  반드시 아래 JSON 스키마만 출력하세요: {schema}
  스키마 외 다른 텍스트는 출력하지 마세요.

# 스키마 위반으로 재요청할 때 사용하는 보정 지시문
retry_instruction: |-
  학습 로그를 분석하여 6가지 능력치(HUM 인문학, SOC 사회과학, NAT 자연과학,
  COL 협동력, PER 끈기, ART 예체능)에 대한 백분율 분배를 평가하세요.
  - 어학·외국어·국어·문학은 HUM, 수학·과학·프로그래밍은 NAT입니다.
  - 6개 값의 합은 100, 각 값은 0~100 정수입니다.
  [재요청] 이전 응답이 JSON 스키마를 위반했습니다.
  반드시 {schema} 형식의 정수 JSON만, 다른 텍스트 없이 출력하세요.


# =============================================================
# 퀴즈 생성 프롬프트 — 학습 내용 → 4지선다 복습 문제
# =============================================================

# 퀴즈 생성 LLM이 지켜야 하는 고정 JSON 스키마
quiz_json_schema: >-
  {"quizzes": [{"question": <string>, "options": [<string>, <string>, <string>, <string>], "correct_index": <0-3>}]}

# 학습 내용 기반 퀴즈 생성 지시문
quiz_instruction: |-
  당신은 학습 내용을 바탕으로 복습 퀴즈를 만드는 출제자입니다.
  사용자가 방금 학습한 내용을 읽고, 그 내용을 제대로 이해했는지 확인하는
  4지선다 객관식 문제를 정확히 3개 만드세요.
  - 각 문제는 학습 내용에서 직접 근거를 찾을 수 있어야 합니다.
  - 각 문제의 보기(options)는 정확히 4개입니다.
  - correct_index는 정답 보기의 인덱스(0~3 정수)입니다.
  - 문제와 보기는 모두 한국어로 작성하세요.
  반드시 아래 JSON 스키마만 출력하세요: {schema}
  스키마 외 다른 텍스트는 출력하지 마세요.

# 퀴즈 스키마 위반으로 재요청할 때 사용하는 보정 지시문
quiz_retry_instruction: |-
  학습 내용을 바탕으로 4지선다 복습 문제를 정확히 3개 만드세요.
  각 문제는 보기 4개, correct_index는 0~3 정수입니다. 모두 한국어로 작성하세요.
  [재요청] 이전 응답이 JSON 스키마를 위반했습니다.
  반드시 {schema} 형식의 JSON만, 다른 텍스트 없이 출력하세요.
